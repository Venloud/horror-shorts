name: Night Files buffer fill

# Generates finished videos into the FIFO buffer only.
# It never calls publish.py, TikTok, or YouTube.

on:
  schedule:
    - cron: "10 */6 * * *"
  workflow_dispatch:
    inputs:
      target_buffer:
        description: "Generate only when fewer than this many complete videos are waiting"
        type: number
        default: 2
        required: false
      fresh_images:
        description: "Generate fresh images"
        type: boolean
        default: true
        required: false

permissions:
  contents: write

concurrency:
  group: night-files-buffer-fill
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Remotion composition layer
        run: npm install --prefix remotion --no-audit --no-fund

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core > /dev/null

      - name: Get caption font
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/Anton-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || true

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v4
          restore-keys: hf-models-

      - name: Install Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt

      - name: Check buffer
        id: buffer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          count=$(cd pipeline && python buffer_status.py)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Buffer has $count complete waiting video(s)."

      - name: Decide whether to generate
        id: decide
        env:
          COUNT: ${{ steps.buffer.outputs.count }}
          TARGET: ${{ inputs.target_buffer || '2' }}
        run: |
          if [ "$COUNT" -lt "$TARGET" ]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "Buffer below target ($COUNT < $TARGET): generating one video."
          else
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "Buffer already at target ($COUNT >= $TARGET): no generation needed."
          fi


      - name: Make and queue one video
        if: steps.decide.outputs.generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SI_API_KEY: ${{ secrets.SI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: cd pipeline && python main.py

      - name: Upload generated buffer artifacts
        if: always() && steps.decide.outputs.generate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: buffer-fill-${{ github.run_id }}
          path: |
            output/**/final.mp4
            output/**/caption.txt
            output/**/caption.json
            output/**/story.json
            output/**/poses_sheet.png
            output/**/plates_sheet.png
            output/**/contact_sheet.png
            output/**/summary.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Report final buffer state
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "Final buffer count:"
          cd pipeline && python buffer_status.py
