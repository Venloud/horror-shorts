name: Continuous Integration

# This workflow is project CI, not a social-platform connection workflow.
# It validates repository code on pushes and pull requests.
# It never exchanges OAuth codes, stores tokens, publishes videos, or calls TikTok/YouTube.

# PAUSED BY USER 2026-10-13: all automation disabled, preserve original trigger config below.
on:
  push:
    branches:
      - main
    # Buffer queue receipts have their own offline-tested writer; don't run full
    # render/unit CI twice for every 15-minute queue admission.
    paths-ignore:
      - data/buffer_backfill_queue.json
  pull_request:
    branches:
      - main
  workflow_dispatch: # Manual preview, no publishing or schedule.


# CI verifies approved assets and scripts without writing to the repository.
# CI verifies approved character art without mutating the repository.
permissions:
  contents: read

jobs:
  validate:

    name: Validate Night Files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg for offline render tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Validate Python syntax
        run: |
          python -m compileall -q pipeline

      - name: Workflow step order and unit tests
        run: |
          python -m pip install -q pyyaml pytest
          python pipeline/workflow_order_check.py
          cd pipeline && python -m pytest -q test_repeat_guard.py test_workflow_order_check.py

      - name: Verify reusable graphics, Remotion integration, and timed audio
        run: |
          python -m pip install -q "Pillow>=10" "numpy>=1.24" soundfile
          python -m unittest discover -s tests -p test_free_motion_toolkit.py -v
          python -m unittest discover -s tests -p test_remotion_post.py -v
          python -m unittest discover -s tests -p test_cover_frame.py -v
          node --check remotion/render_polish.mjs

      - name: Validate approved character assets, checkpoints and the production shot list (mocks, 0 API calls)
        run: |
          python -m pip install -q "Pillow>=10" "numpy>=1.24" requests pyyaml
          python -m unittest discover -s tests -p test_night_files_pipeline.py -v
          python -m unittest discover -s tests -p test_clue_board_and_viewer_value.py -v
          python -m unittest discover -s tests -p test_writing_room.py -v
          python -m unittest discover -s tests -p test_editorial_rules.py -v
          python -m unittest discover -s tests -p test_clip_matching.py -v
          python -m unittest discover -s tests -p test_writer_reliability.py -v
          python -m unittest discover -s tests -p test_cinematic_editor.py -v

      - name: Verify Buffer.com delivery and historic TikTok recovery (offline)
        run: |
          python -m unittest discover -s tests -p test_buffer_delivery.py -v

      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [Path("config.json")]
          files += sorted(Path("pipeline").glob("*.json"))

          for path in files:
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"OK JSON: {path}")
          PY

      - name: Validate music rights policy
        run: python pipeline/music_rights_check.py

      - name: Validate Ruflo contracts when present
        run: |
          if [ -f pipeline/ruflo_check.py ]; then
            python pipeline/ruflo_check.py
          fi
          if [ -f pipeline/ruflo_task_check.py ]; then
            python pipeline/ruflo_task_check.py
          fi

      - name: Verify critical repository files
        run: |
          test -f config.json
          test -f pipeline/main.py
          test -f pipeline/publish.py
          test -f pipeline/buffer.py
          test -f .github/workflows/daily.yml
          test -f .github/workflows/buffer_fill.yml
          test -f .github/workflows/connect-tiktok.yml
          echo "Critical Night Files structure: OK"
