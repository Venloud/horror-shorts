name: Night Files buffer fill

# Generates exactly one finished video per manual run, without publishing.

# Manual only: owner starts an isolated build, no scheduled generation.
on:
  workflow_dispatch:
    inputs:
      fresh_images:
        description: "Generate fresh images (ON: new plates for a new story, a resume redraws only missing/corrupt ones; OFF: reuse this story's + matching library plates first)"
        type: boolean
        default: true
        required: false
      retry_story_id:
        description: "Resume a parked story by id (data/failed_stories/<id>); empty = normal run"
        type: string
        default: ""
        required: false
# The builder saves history/checkpoints to this repository; GitHub's default token is read-only.
permissions:
  contents: write
  actions: read

concurrency:
  group: night-files
  cancel-in-progress: false

jobs:
  fill:

    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Night Files Remotion editing layer
        run: |
          if python -c "import json,sys;sys.exit(0 if json.load(open('config.json')).get('remotion_polish',False) else 1)"; then
            npm install --prefix remotion --no-audit --no-fund
          else
            echo "Remotion polishing disabled; using existing non-explainer compositing"
          fi

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core > /dev/null

      - name: Get caption font
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/Anton-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || true

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v4
          restore-keys: hf-models-

      - name: Install Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt

      - name: Check buffer
        id: buffer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          count=$(cd pipeline && python buffer_status.py)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Buffer has $count complete waiting video(s)."

      - name: Cloudflare neurons used today (every build adds to it)
        uses: actions/cache/restore@v4
        with:
          path: cache/cf-usage
          key: cf-usage-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cf-usage-

      # Checkpoints are saved per story ("ckpt-<story id>-<run id>"): a retry restores that story's newest entry,
      # a normal run the newest entry of any story (main.py resumes an unfinished one before picking a new story).
      - name: Restore checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: cache/checkpoint
          key: ckpt-restore-${{ github.run_id }}
          restore-keys: |
            ckpt-${{ inputs.retry_story_id || 'none' }}-
            ckpt-

      - name: Check for unfinished checkpoint
        id: checkpoint
        run: |
          if [ -s cache/checkpoint/story.json ] && [ ! -f cache/checkpoint/done.json ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "Unfinished checkpoint found: this run will resume it."
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "No unfinished checkpoint found."
          fi

      - name: Decide whether to generate
        id: decide
        env:
          COUNT: ${{ steps.buffer.outputs.count }}
          CHECKPOINT: ${{ steps.checkpoint.outputs.pending }}
        run: |
          echo "generate=true" >> "$GITHUB_OUTPUT"
          echo "Manual run: make and buffer exactly one video, resuming a checkpoint if present."


      - name: Production readiness preflight
        if: steps.decide.outputs.generate == 'true'
        env:
          RENDER_STYLE: "explainer"
        run: cd pipeline && python production_readiness.py

      - name: Make and queue one video
        if: steps.decide.outputs.generate == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SI_API_KEY: ${{ secrets.SI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MAKEUP_POSTS: "0"  # generate and buffer only, never publish during manual fill
          RENDER_STYLE: "explainer"  # fail instead of silently using classic style
          FRESH_IMAGES: ${{ inputs.fresh_images }}  # the checkbox (was never passed on, so it did nothing)
          RETRY_STORY_ID: ${{ inputs.retry_story_id }}
        run: cd pipeline && python main.py

      - name: Save today's Cloudflare usage (also when the build failed)
        if: always() && hashFiles('cache/cf-usage/usage.json') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/cf-usage
          key: cf-usage-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save new TikTok token if TikTok rotated it (make-up post)
        if: always() && hashFiles('.new_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set TIKTOK_REFRESH_TOKEN --repo "${{ github.repository }}" < .new_refresh_token
            echo "Refresh token updated."
          else
            echo "::warning::TikTok gave a new refresh token but GH_PAT is not set, so it could not be saved."
          fi
          rm -f .new_refresh_token

      - name: Save history (used topics, skipped stories, make-up post, counter)
        if: always() && steps.decide.outputs.generate == 'true'
        run: bash pipeline/push_state.sh "Buffer story"

      - name: Check history has every buffered/posted video
        if: always() && steps.decide.outputs.generate == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: cd pipeline && python history_check.py

      - name: Upload generated buffer artifacts
        id: artifact
        if: always() && steps.decide.outputs.generate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: buffer-fill-${{ github.run_id }}
          path: |
            output/**/final.mp4
            output/**/explainer_polished.mp4
            output/**/caption.txt
            output/**/caption.json
            output/**/story.json
            output/**/poses_sheet.png
            output/**/plates_sheet.png
            output/**/contact_sheet.png
            output/**/summary.txt
            output/**/production_gate.json
            output/**/visual_qa.json
            output/**/shot_manifest.json
            output/**/provenance.json
          retention-days: 7
          if-no-files-found: error

      # The checkpoint is marked complete by main.py only after the video passed validation AND entered the buffer.
      - name: Name the checkpoint by its story
        id: ckpt_key
        if: always()
        run: |
          sid=$(python -c "import json,pathlib;d=pathlib.Path('cache/checkpoint');f=d/'story.json' if (d/'story.json').exists() else d/'done.json';print(json.loads(f.read_text()).get('story_id') or 'none' if f.exists() else 'none')" 2>/dev/null || echo none)
          echo "key=ckpt-${sid}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "Checkpoint cache key: ckpt-${sid}-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Save checkpoint for the next run
        if: always() && hashFiles('cache/checkpoint/**') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/checkpoint
          key: ${{ steps.ckpt_key.outputs.key }}

      - name: Report final buffer state
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "Final buffer count:"
          cd pipeline && python buffer_status.py
