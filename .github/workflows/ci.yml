name: Continuous Integration

# This workflow is project CI, not a social-platform connection workflow.
# It validates repository code on pushes and pull requests.
# It never exchanges OAuth codes, stores tokens, publishes videos, or calls TikTok/YouTube.

# PAUSED BY USER 2026-10-13: all automation disabled, preserve original trigger config below.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:

    name: Validate Night Files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: |
          python -m compileall -q pipeline

      - name: Export and validate matching host close-ups
        run: |
          python -m pip install -q "Pillow>=10" "numpy>=1.24"
          python - <<'PY'
          import sys, zipfile
          from pathlib import Path
          from PIL import Image, ImageDraw
          sys.path.insert(0, "pipeline")
          import sprites
          out = Path("output/host-closeups")
          count = sprites.export_stage_closeups(out)
          images = sorted(out.glob("*.png"))
          assert count == len(images) == 19
          for f in images:
              with Image.open(f) as im:
                  assert im.size == (1600, 2000), (f.name, im.size)
                  assert im.mode == "RGBA" and im.getpixel((0, 0))[3] == 0, f.name
          cell_w, cell_h = 240, 330
          board = Image.new("RGB", (5 * cell_w, 4 * cell_h), "#31353b")
          d = ImageDraw.Draw(board)
          for k, f in enumerate(images):
              with Image.open(f) as im:
                  im.thumbnail((cell_w - 12, cell_h - 44))
                  x, y = k % 5 * cell_w, k // 5 * cell_h
                  board.paste(im, (x + (cell_w - im.width) // 2, y + 5), im)
                  d.text((x + 8, y + cell_h - 29), f.stem[5:35], fill="white")
          board.save("output/host-closeups-contact.jpg", quality=92)
          # Render one character-first storyboard frame. This catches missing methods,
          # bad dimensions and layout mistakes that compileall cannot detect.
          import explainer
          assert explainer.CONFIG.get("explainer_character_stage") is True
          shot = {"type": "scene", "location": "train carriage", "insert": "",
                  "primary": "you", "action": "holding", "expression": "worried",
                  "view": "three_quarter", "facing": "right", "secondary": "",
                  "action2": "standing", "shot_type": "medium",
                  "motion": "none", "text_mode": "none", "text": ""}
          story = {"title": "Stage preview",
                   "scenes": [{"narration": "You inspect the luggage inside the train compartment."}]}
          narration = {"duration": 3.0, "scene_times": [(0.0, 3.0)],
                       "words": [{"word": "luggage", "start": 0.1, "end": 2.5, "scene": 0}]}
          plan = {"cast": {}, "locations": [], "inserts": [], "scenes": [{"shots": [shot]}]}
          seg = {"shot": shot, "scene": 0, "start": 0.0, "end": 3.0}
          renderer = explainer.Renderer(story, narration, plan, {"plates": {}, "inserts": {}}, [seg])
          screenshot = renderer.frame_at(0.8, 3.0)
          assert screenshot.size == (1080, 1920)
          screenshot.save("output/host-stage-preview.png")
          with zipfile.ZipFile("output/Night_Files_Matched_Closeups_19.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for f in images:
                  z.write(f, f.name)
              z.write("output/host-closeups-contact.jpg", "PREVIEW_contact.jpg")
          print(f"Exported {len(images)} native-resolution, transparent, matching close-ups")
          PY

      - name: Upload matching close-up pack and contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: night-files-matched-closeups
          path: |
            output/Night_Files_Matched_Closeups_19.zip
            output/host-closeups-contact.jpg
            output/host-stage-preview.png
          if-no-files-found: error

      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [Path("config.json")]
          files += sorted(Path("pipeline").glob("*.json"))

          for path in files:
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"OK JSON: {path}")
          PY

      - name: Validate music rights policy
        run: python pipeline/music_rights_check.py

      - name: Validate Ruflo contracts when present
        run: |
          if [ -f pipeline/ruflo_check.py ]; then
            python pipeline/ruflo_check.py
          fi
          if [ -f pipeline/ruflo_task_check.py ]; then
            python pipeline/ruflo_task_check.py
          fi

      - name: Verify critical repository files
        run: |
          test -f config.json
          test -f pipeline/main.py
          test -f pipeline/publish.py
          test -f pipeline/buffer.py
          test -f .github/workflows/daily.yml
          test -f .github/workflows/buffer_fill.yml
          test -f .github/workflows/connect-tiktok.yml
          echo "Critical Night Files structure: OK"
