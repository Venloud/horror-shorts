name: yt_check

# Manual check that the YouTube refresh token still works. No upload.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-auth requests
      - name: Refresh YouTube token
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        shell: python
        run: |
          import os, sys
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request

          missing = [k for k in ("YT_CLIENT_ID", "YT_CLIENT_SECRET", "YT_REFRESH_TOKEN") if not os.environ.get(k)]
          if missing:
              print("Missing secrets: " + ", ".join(missing))
              sys.exit(1)
          # Shape checks only (no secret values are printed).
          cid, sec, tok = (os.environ[k] for k in ("YT_CLIENT_ID", "YT_CLIENT_SECRET", "YT_REFRESH_TOKEN"))
          for name, v in (("YT_CLIENT_ID", cid), ("YT_CLIENT_SECRET", sec), ("YT_REFRESH_TOKEN", tok)):
              extra = []
              if v != v.strip():
                  extra.append("has leading/trailing spaces or newline")
              if v.strip()[:1] in "\"'=" or v.strip()[-1:] in "\"'":
                  extra.append("starts/ends with a quote or '='")
              print(f"{name}: {len(v)} chars" + (" - " + "; ".join(extra) if extra else ""))
          print("client id ends with .apps.googleusercontent.com:", cid.strip().endswith(".apps.googleusercontent.com"))
          print("client secret starts with GOCSPX-:", sec.strip().startswith("GOCSPX-"))
          print("refresh token starts with 1//:", tok.strip().startswith("1//"))
          creds = Credentials(None, refresh_token=os.environ["YT_REFRESH_TOKEN"],
                              client_id=os.environ["YT_CLIENT_ID"],
                              client_secret=os.environ["YT_CLIENT_SECRET"],
                              token_uri="https://oauth2.googleapis.com/token",
                              scopes=["https://www.googleapis.com/auth/youtube.upload"])
          try:
              creds.refresh(Request())
          except Exception as e:
              print(f"YouTube token FAILED: {type(e).__name__}: {e}")
              sys.exit(1)
          print("YouTube token OK")
