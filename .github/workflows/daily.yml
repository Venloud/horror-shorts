name: Daily horror video

# Twice a day: publish the next buffered video. Generate when the buffer is empty, or resume an unfinished checkpoint.
on:
  schedule:
    - cron: "40 15 * * *"
    - cron: "40 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: night-files
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Remotion composition layer
        run: npm install --prefix remotion --no-audit --no-fund

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core > /dev/null

      - name: Get caption font (Anton, free license)
        run: |
          mkdir -p assets/fonts
          if [ ! -s assets/fonts/Anton-Regular.ttf ]; then
            curl -fsSL -o assets/fonts/Anton-Regular.ttf \
              https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || true
          fi

      - name: Cache models (voice, depth, SD-Turbo)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v4  # v4: + CLIP ViT-B/32 (asset library embeddings)

      - name: Real media search cache (24 h, Pexels / Pixabay / Wikimedia / Smithsonian)
        uses: actions/cache@v4
        with:
          path: cache/media-search
          key: media-search-${{ github.run_id }}
          restore-keys: media-search-

      - name: Cloudflare neurons used today (every build adds to it)
        uses: actions/cache/restore@v4
        with:
          path: cache/cf-usage
          key: cf-usage-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cf-usage-

      - name: Restore the checkpoint of an unfinished build
        uses: actions/cache/restore@v4
        with:
          path: cache/checkpoint
          key: ckpt-${{ github.run_id }}
          restore-keys: |
            ckpt-

      - name: Check for an unfinished checkpoint
        id: checkpoint
        run: |
          if [ -s cache/checkpoint/story.json ] && [ ! -f cache/checkpoint/done.json ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "Unfinished checkpoint found: daily run can resume it."
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "No unfinished checkpoint found."
          fi

      - name: Install Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt

      - name: Is cutout mode on
        id: cutout
        run: |
          on=$(python -c "import json;c=json.load(open('config.json'));print('true' if c.get('render_style')=='cutout' or c.get('cutout_for_modes') else 'false')")
          echo "on=$on" >> "$GITHUB_OUTPUT"

      - name: Cache cut-out models (rembg)
        if: steps.cutout.outputs.on == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-models-v1

      - name: Install cut-out tools (rembg; the code falls back to a gray-background key without it)
        if: steps.cutout.outputs.on == 'true'
        run: |
          pip install -q rembg onnxruntime || echo "rembg install failed, the gray-background key is used"

      - name: Check production buffer
        id: buffer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          count=$(cd pipeline && python buffer_status.py)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Production buffer contains $count waiting video(s)."

      - name: Production readiness preflight
        if: steps.buffer.outputs.count == '0' || steps.checkpoint.outputs.pending == 'true'
        run: cd pipeline && python production_readiness.py

      - name: Make video when buffer is empty or a checkpoint is pending
        id: make
        if: steps.buffer.outputs.count == '0' || steps.checkpoint.outputs.pending == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          # real media first (each source is skipped if its key is missing)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SI_API_KEY: ${{ secrets.SI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}  # backup story writer (skipped if missing)
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: cd pipeline && python main.py

      - name: Post next buffered video
        if: success()
        id: publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
        run: cd pipeline && python publish.py
      - name: Save checkpoint for the next run
        if: always() && hashFiles('cache/checkpoint/**') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/checkpoint
          key: ckpt-${{ github.run_id }}

      - name: Save today's Cloudflare usage (also when the build failed)
        if: always() && hashFiles('cache/cf-usage/usage.json') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/cf-usage
          key: cf-usage-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save new TikTok token if TikTok rotated it
        if: always() && hashFiles('.new_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set TIKTOK_REFRESH_TOKEN --repo "${{ github.repository }}" < .new_refresh_token
            echo "Refresh token updated."
          else
            echo "::warning::TikTok gave a new refresh token but GH_PAT is not set, so it could not be saved."
          fi
          rm -f .new_refresh_token

      - name: Save history after posting
        if: success()
        run: bash pipeline/push_state.sh "Posted story"

      - name: Keep the generated/post result for download (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.publish.outputs.video_number && format('video-{0}', steps.publish.outputs.video_number) || format('run-{0}', github.run_id) }}
          path: |
            output/**/final.mp4
            output/**/caption.txt
            output/**/story.json
            output/**/poses_sheet.png
            output/**/plates_sheet.png
            output/**/contact_sheet.png
            output/**/summary.txt
            output/**/production_gate.json
          retention-days: 7
          if-no-files-found: ignore
