name: Build video (buffer)

# Every 3 hours: if fewer than BUFFER_SIZE finished videos are waiting on the "buffer" release, make one.
# A failed build (Gemini 503, image quota...) exits quietly and the next run tries again; the phone alert only
# goes out when the buffer is empty. Test builds never touch the buffer, history or Cloudflare.
on:
  schedule:
    # :50 = just after the 11:40 AM / 8:40 PM New York publish slots, so builds rarely delay a post.
    - cron: "50 */3 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test build: not added to the buffer, no history (mp4 kept as an artifact); reuses the last story + images"
        type: boolean
        default: false
      visual_mode:
        description: "Force a visual mode for this build (classic / fast / analog); empty = the A/B rotation"
        type: string
        default: ""
      fresh_images:
        description: "Test build only: write a NEW story with fresh (Cloudflare) images. Off = reuse the last story + images"
        type: boolean
        default: false
      render_style:
        description: "EXPERIMENTAL: classic / cutout (pose-set characters on background plates); empty = config"
        type: string
        default: ""

permissions:
  contents: write

# Shared with daily.yml, so a build and a publish never write history.json at the same time.
concurrency:
  group: night-files
  cancel-in-progress: false

env:
  BUFFER_SIZE: 3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Is the buffer full?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          waiting=$(gh release view buffer --repo "${{ github.repository }}" --json assets \
            -q '[.assets[].name | select(endswith(".mp4"))] | length' 2>/dev/null || echo 0)
          echo "Videos waiting in the buffer: $waiting (target $BUFFER_SIZE)"
          # data/hold_builds.txt on main = production builds on hold (untested changes must not reach the buffer);
          # test builds still run. Delete the file to release the hold.
          hold=$(gh api "repos/${{ github.repository }}/contents/data/hold_builds.txt" --jq .name 2>/dev/null || true)
          if [ -n "$hold" ] && [ "${{ inputs.test }}" != "true" ]; then
            echo "Production builds are ON HOLD (data/hold_builds.txt exists): nothing built."
          elif [ "${{ inputs.test }}" = "true" ] || [ "$waiting" -lt "$BUFFER_SIZE" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Buffer is full, nothing to build."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.build == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.build == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system tools
        if: steps.check.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core > /dev/null

      - name: Get caption font (Anton, free license)
        if: steps.check.outputs.build == 'true'
        run: |
          mkdir -p assets/fonts
          if [ ! -s assets/fonts/Anton-Regular.ttf ]; then
            curl -fsSL -o assets/fonts/Anton-Regular.ttf \
              https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || true
          fi

      - name: Cache models (voice, depth, SD-Turbo)
        if: steps.check.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v4  # v4: + CLIP ViT-B/32 (asset library embeddings)

      - name: Real media search cache (24 h, Pexels / Pixabay / Wikimedia / Smithsonian)
        if: steps.check.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: cache/media-search
          key: media-search-${{ github.run_id }}
          restore-keys: media-search-

      - name: Restore last run's images (test mode reuses them)
        if: steps.check.outputs.build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache/last-images
          key: last-images-${{ github.run_id }}
          restore-keys: last-images-

      - name: Restore the checkpoint of an unfinished build
        if: steps.check.outputs.build == 'true' && inputs.test != true
        uses: actions/cache/restore@v4
        with:
          path: cache/checkpoint
          key: ckpt-${{ github.run_id }}
          restore-keys: ckpt-

      - name: Install Python packages
        if: steps.check.outputs.build == 'true'
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt

      - name: Is cutout mode on for this build?
        if: steps.check.outputs.build == 'true'
        id: cutout
        run: |
          on=$(python -c "import json;c=json.load(open('config.json'));print('true' if c.get('render_style')=='cutout' or c.get('cutout_for_modes') else 'false')")
          if [ "${{ inputs.render_style }}" = "cutout" ]; then on=true; fi
          if [ "${{ inputs.render_style }}" = "classic" ]; then on=false; fi
          echo "on=$on" >> "$GITHUB_OUTPUT"

      - name: Cache cut-out models (rembg)
        if: steps.check.outputs.build == 'true' && steps.cutout.outputs.on == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-models-v1

      - name: Install cut-out tools (rembg; the code falls back to a gray-background key without it)
        if: steps.check.outputs.build == 'true' && steps.cutout.outputs.on == 'true'
        run: |
          pip install -q rembg onnxruntime || echo "rembg install failed, the gray-background key is used"

      - name: Make video
        id: make
        if: steps.check.outputs.build == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TEST_FRESH: ${{ inputs.fresh_images && 'true' || '' }}
          VISUAL_MODE: ${{ inputs.visual_mode || '' }}
          RENDER_STYLE: ${{ inputs.render_style || '' }}
          # real media first (each source is skipped if its key is missing)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SI_API_KEY: ${{ secrets.SI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # backup story writer (skipped if missing)
          # only used to make up a missed publish slot right after the build
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: cd pipeline && python main.py ${{ inputs.test && '--test' || '' }}

      - name: Save new TikTok token if TikTok rotated it (make-up post)
        if: always() && hashFiles('.new_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set TIKTOK_REFRESH_TOKEN --repo "${{ github.repository }}" < .new_refresh_token
            echo "Refresh token updated."
          else
            echo "::warning::TikTok gave a new refresh token but GH_PAT is not set, so it could not be saved."
          fi
          rm -f .new_refresh_token

      - name: Save story history (marks inbox items / cases as used) + missed slot
        if: success() && steps.check.outputs.build == 'true' && inputs.test != true
        run: bash pipeline/push_state.sh "Buffer story"

      - name: Save the checkpoint (story, narration, images; or "done")
        if: always() && steps.check.outputs.build == 'true' && inputs.test != true && hashFiles('cache/checkpoint/**') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/checkpoint
          key: ckpt-${{ github.run_id }}

      - name: Save this run's images for test mode
        if: success() && inputs.test != true && hashFiles('.built') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/last-images
          key: last-images-${{ github.run_id }}

      - name: Keep the video for download (7 days)
        if: always() && steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Builds have no post number yet: named by story id (video-N only if a make-up post went out here).
          name: ${{ steps.make.outputs.video_number && format('video-{0}', steps.make.outputs.video_number) || format('{0}-{1}', inputs.test && 'test' || 'build', steps.make.outputs.story_id || github.run_id) }}
          path: |
            output/**/final.mp4
            output/**/caption.txt
            output/**/story.json
            output/**/poses_sheet.png
            output/**/plates_sheet.png
            output/**/contact_sheet.png
            output/**/summary.txt
          retention-days: 7
          if-no-files-found: ignore
