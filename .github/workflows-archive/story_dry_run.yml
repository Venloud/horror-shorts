name: Night Files story dry run

# Writes ONE story from an inbox file exactly like production (research, editor, critic, fact check), voices it and
# fits the duration, then prints the script + length + critic / fact-check results (artifact "story-dry-run").
# No images, no render, no buffer, no history, no TikTok / YouTube: nothing is published or marked used.
on:
  workflow_dispatch:
    inputs:
      inbox_file:
        description: "inbox file to dry-run (e.g. le_prince_remake.txt)"
        default: "le_prince_remake.txt"
        required: true

permissions:
  contents: read

concurrency:
  group: story-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null

      - name: Cache models
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v4
          restore-keys: hf-models-

      - name: Install Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt

      - name: Write + voice the story (dry run)
        env:
          INBOX_FILE: ${{ inputs.inbox_file }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: cd pipeline && python story_dry_run.py

      - name: Keep the script and story.json (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-dry-run-${{ github.run_id }}
          path: |
            output/dry_run/report.txt
            output/dry_run/story.json
          retention-days: 7
          if-no-files-found: warn
