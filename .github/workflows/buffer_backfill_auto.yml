name: Automated Buffer YouTube backfill

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: night-files
  cancel-in-progress: false

jobs:
  queue_one:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      BUFFER_YOUTUBE_CHANNEL_ID: "6ad2d7d2778b240e2f331d8e"
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests yt-dlp
      - name: Ensure ffprobe for validating recovered videos
        run: command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Queue one eligible video with Buffer
        run: python tools/auto_buffer_backfill.py
      # State is now written directly to GitHub BEFORE the Buffer API mutation.
      # No stale checkout push can overwrite concurrent Daily/video history.
      - name: Preserve rotated TikTok token after optional public-video discovery
        if: always() && hashFiles('.new_refresh_token') != ''
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set TIKTOK_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < .new_refresh_token
          else
            echo "::error::Token rotated but GH_PAT is absent; TikTok reconnect required"
            exit 1
          fi
          rm -f .new_refresh_token
