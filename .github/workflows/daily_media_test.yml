name: Night Files media production test

on:
  workflow_dispatch:
    inputs:
      fresh_images:
        description: "Generate fresh images"
        type: boolean
        default: true
        required: false

permissions:
  contents: write

concurrency:
  group: night-files-media-test
  cancel-in-progress: false

jobs:
  media-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core > /dev/null

      - name: Get caption font
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/Anton-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || true

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v4
          restore-keys: hf-models-

      - name: Install Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt

      - name: Run isolated media production test
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
          PEXELS_API_KEY: \${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: \${{ secrets.PIXABAY_API_KEY }}
          SI_API_KEY: \${{ secrets.SI_API_KEY }}
          GROQ_API_KEY: \${{ secrets.GROQ_API_KEY }}
          TEST_FRESH: \${{ inputs.fresh_images }}
          HYPERFRAMES_VERSION: "0.8.100"
        run: python pipeline/media_production_test.py

      - name: Upload media test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-production-test-\${{ github.run_id }}
          path: |
            output/**/final.mp4
            output/**/hyperframes_test.mp4
            output/**/media_production_test.json
            output/**/premiere_mcp/handoff.json
            output/**/summary.txt
          retention-days: 7
          if-no-files-found: ignore
