name: Queue Night Files to Buffer YouTube

# Manual delivery only. Does not touch the restricted Google API uploader.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: night-files-buffer-youtube
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install request client
        run: pip install requests
      - name: Queue one pending video through Buffer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
        run: cd pipeline && python buffer_youtube.py
