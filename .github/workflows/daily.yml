name: Daily horror video

# Publisher: no generation here. Takes the oldest finished video from the "buffer" release (filled by build.yml),
# sends it to TikTok, deletes it from the buffer and sends the phone alert. About a minute.
on:
  schedule:
    # Twice a day, in UTC. 15:40 UTC = 11:40 AM New York, 00:40 UTC = 8:40 PM New York (daylight time).
    - cron: "40 15 * * *"
    - cron: "40 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # lets an empty-buffer slot start build.yml

# Shared with build.yml, so a build and a publish never write history.json at the same time.
concurrency:
  group: night-files
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -q requests google-api-python-client google-auth

      - name: Post the oldest buffered video to TikTok + YouTube Shorts
        id: publish
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
        run: cd pipeline && python publish.py

      - name: Save new TikTok token if TikTok rotated it
        if: always() && hashFiles('.new_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set TIKTOK_REFRESH_TOKEN --repo "${{ github.repository }}" < .new_refresh_token
            echo "Refresh token updated."
          else
            echo "::warning::TikTok gave a new refresh token but GH_PAT is not set, so it could not be saved."
          fi
          rm -f .new_refresh_token

      - name: Save history + missed slot
        if: success()
        run: bash pipeline/push_state.sh "Posted story"

      - name: Buffer was empty - start a build now (it posts as soon as the video is ready)
        if: success() && hashFiles('.trigger_build') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: gh workflow run build.yml --repo "${{ github.repository }}" --ref main

      - name: Keep the posted video for download (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The channel's own post number (data/counter.json); a slot that posted nothing gets no number.
          name: ${{ steps.publish.outputs.video_number && format('video-{0}', steps.publish.outputs.video_number) || format('unposted-{0}', github.run_id) }}
          path: |
            output/publish/final.mp4
            output/publish/caption.txt
          retention-days: 7
          if-no-files-found: ignore
