name: Daily horror video

on:
  schedule:
    - cron: "40 21 * * *"
  workflow_dispatch:
    inputs:
      no_upload:
        description: "Test run: make the video but don't send it to TikTok"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core > /dev/null

      - name: Get caption font (Anton, free license)
        run: |
          mkdir -p assets/fonts
          if [ ! -s assets/fonts/Anton-Regular.ttf ]; then
            curl -fsSL -o assets/fonts/Anton-Regular.ttf \
              https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf || true
          fi

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-v1

      - name: Install Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt

      - name: Make video and send to TikTok
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          cd pipeline
          if [ "${{ inputs.no_upload }}" = "true" ]; then
            python main.py --no-upload
          else
            python main.py
          fi

      - name: Save new TikTok token if TikTok rotated it
        if: always() && hashFiles('.new_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set TIKTOK_REFRESH_TOKEN --repo "${{ github.repository }}" < .new_refresh_token
            echo "Refresh token updated."
          else
            echo "::warning::TikTok gave a new refresh token but GH_PAT is not set, so it could not be saved."
          fi
          rm -f .new_refresh_token

      - name: Save story history (prevents repeats)
        if: success()
        run: |
          git config user.name "horror-bot"
          git config user.email "horror-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Add story $(date -u +%F)"
          git push

      - name: Keep the video for download (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            output/**/final.mp4
            output/**/caption.txt
            output/**/story.json
          retention-days: 7
          if-no-files-found: ignore
