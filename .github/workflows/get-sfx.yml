name: Download sound effects (one time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: Download sound library (BigSoundBank + Freesound, CC0 only)
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          rm -f assets/sfx/*.mp3
          python pipeline/get_sfx.py
      - name: Save to repo
        run: |
          git config user.name "horror-bot"
          git config user.email "horror-bot@users.noreply.github.com"
          git add -A assets/sfx data/sfx_credits.json
          git diff --cached --quiet || git commit -m "Update sound effects library"
          git pull --rebase
          git push
