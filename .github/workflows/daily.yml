name: Daily horror video

# Publisher: no generation here. Takes the oldest finished video from the "buffer" release (filled by build.yml),
# sends it to TikTok, deletes it from the buffer and sends the phone alert. About a minute.
on:
  schedule:
    # Twice a day, in UTC. 15:40 UTC = 11:40 AM New York, 00:40 UTC = 8:40 PM New York (daylight time).
    - cron: "40 15 * * *"
    - cron: "40 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with build.yml, so a build and a publish never write history.json at the same time.
concurrency:
  group: night-files
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -q requests google-api-python-client google-auth

      - name: Post the oldest buffered video to TikTok + YouTube Shorts
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
        run: cd pipeline && python publish.py

      - name: Save new TikTok token if TikTok rotated it
        if: always() && hashFiles('.new_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set TIKTOK_REFRESH_TOKEN --repo "${{ github.repository }}" < .new_refresh_token
            echo "Refresh token updated."
          else
            echo "::warning::TikTok gave a new refresh token but GH_PAT is not set, so it could not be saved."
          fi
          rm -f .new_refresh_token

      - name: Save the TikTok result in history
        if: success()
        run: |
          git config user.name "horror-bot"
          git config user.email "horror-bot@users.noreply.github.com"
          git diff --quiet -- data/history.json && exit 0
          git show HEAD:data/history.json > "$RUNNER_TEMP/base.json"
          cp data/history.json "$RUNNER_TEMP/ours.json"
          # Up to 3 tries: merge our history changes onto the newest main (no rebase conflicts), then push.
          for i in 1 2 3; do
            git fetch -q origin main
            python pipeline/merge_history.py "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/ours.json"
            git reset -q --mixed origin/main
            git add data/history.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Posted story $(date -u +%F_%H%M)"
            git push origin HEAD:main && exit 0
            echo "Push failed (try $i), retrying"; sleep 5
          done
          exit 1

      - name: Keep the posted video for download (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            output/publish/final.mp4
            output/publish/caption.txt
          retention-days: 7
          if-no-files-found: ignore
